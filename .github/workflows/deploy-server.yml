name: Deploy game server

# Deploys the Cloudflare Worker (party/ + shared/) whenever the server code changes on main.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Until the token exists the deploy step is skipped (with a notice) instead of failing.
on:
  push:
    branches: [main]
    paths:
      - "party/**"
      - "shared/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # the rules tests gate the deploy: a broken engine never reaches players
      - run: npm test

      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # strip stray whitespace/newlines that can sneak in when the secret is pasted
          CLEAN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          # diagnostics only: length and character check, never the value
          echo "token length: ${#CLEAN} (Cloudflare API tokens are 40 characters)"
          if printf '%s' "$CLEAN" | grep -q '[^A-Za-z0-9_-]'; then echo "token has characters that are not allowed in a token"; fi
          if [ -n "$CLEAN" ]; then
            echo "::add-mask::$CLEAN"
            echo "CLOUDFLARE_API_TOKEN=$CLEAN" >> "$GITHUB_ENV"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, skipping the deploy. See README (Deploy)."
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
